<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Game Reviews</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <nav class="navbar navbar-dark bg-dark px-3">
    <span class="navbar-brand mb-0 h1">🎮 Game Reviews</span>
    <div class="d-flex gap-2 genre-buttons">
      <button class="btn btn-outline-light btn-sm" data-genre="mmorpg">MMORPG</button>
      <button class="btn btn-outline-light btn-sm" data-genre="shooter">Shooter</button>
      <button class="btn btn-outline-light btn-sm" data-genre="sailing">Sailing</button>
      <button class="btn btn-outline-light btn-sm" data-genre="permadeath">Permadeath</button>
      <button class="btn btn-outline-light btn-sm" data-genre="superhero">Superhero</button>
      <button class="btn btn-outline-light btn-sm" data-genre="pixel">Pixel</button>
    </div>
  </nav>

  <main class="container my-4">
    <section id="games-section" class="row g-4"></section>
    <section id="details-section" class="d-none"></section>
  </main>

  <script src="script.js"></script>
</body>
</html>
